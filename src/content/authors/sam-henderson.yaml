name: Sam Henderson
role: Lead Pastor, Teaching Pastor
bio: >-
  I have lived in North Mississippi and the Mid-South all my life, I love this
  place, it’s HOME. In the past 18 years, I have served in ministry roles at
  several churches, with over 10 of those years involved with church plants. I
  graduated from the University of Mississippi in 2010 and studied at
  Mid-America Baptist Theological Seminary for 3 years. I am now enrolled at
  Midwestern Baptist Theological Seminary pursuing a Master of Applied Theology
  degree in Preaching. I have been married to my amazing wife Natalie for 9
  years and we have 2 sons; Sammy and James. Our family is excited about how
  the Lord will use us and this church in Coldwater, Mississippi to see gospel
  transformation.
showOnAbout: true
order: 1
