name: Sam Henderson
role: Pastor / Church Planter
bio: >-
  Sam graduated from the University of Mississippi in 2010, studied at
  Mid-America Baptist Theological Seminary for three years, and is now pursuing
  a Master of Applied Theology in Preaching at Midwestern Baptist Theological
  Seminary. He and his wife Natalie have two sons, Sammy and James, and are
  excited to see how the Lord will use them and the church in Coldwater to
  bring gospel transformation.
showOnAbout: true
order: 1
